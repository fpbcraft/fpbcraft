name: FPBPack

on:
  pull_request:
    paths:
      - "tools/fpbpack/**"
      - ".github/workflows/fpbpack.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install GUI dependencies
        working-directory: tools/fpbpack/web
        run: npm install --no-audit --no-fund

      - name: Typecheck GUI
        working-directory: tools/fpbpack/web
        run: npm run typecheck

      - name: Build static GUI
        working-directory: tools/fpbpack/web
        run: npm run build

      - name: Stage GUI for embedding
        working-directory: tools/fpbpack
        run: |
          find internal/webui/dist -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a web/out/. internal/webui/dist/

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: false

      - name: Test
        working-directory: tools/fpbpack
        run: go test ./...

      - name: Vet
        working-directory: tools/fpbpack
        run: go vet ./...

      - name: Build static Unraid binary
        working-directory: tools/fpbpack
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          FPBPACK_VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${FPBPACK_VERSION::12}" -o dist/fpbpack-linux-amd64 ./cmd/fpbpack
          sha256sum dist/fpbpack-linux-amd64 > dist/fpbpack-linux-amd64.sha256
          cp fpbpack-sources.json dist/fpbpack-sources.json
          file dist/fpbpack-linux-amd64

      - name: Build pinned Packwiz helper
        working-directory: tools/fpbpack
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          GOBIN="$PWD/dist" go install github.com/packwiz/packwiz@ef87d964f8cbd52b3b13ea42453ef322290e2b9e
          mv dist/packwiz dist/packwiz-linux-amd64
          sha256sum dist/packwiz-linux-amd64 > dist/packwiz-linux-amd64.sha256
          file dist/packwiz-linux-amd64

      - name: Build Docker image
        env:
          FPBPACK_VERSION: ${{ github.event.pull_request.head.sha }}
        run: docker build --build-arg FPBPACK_VERSION="${FPBPACK_VERSION::12}" -f tools/fpbpack/Dockerfile .

      - name: Upload Unraid binaries
        uses: actions/upload-artifact@v7
        with:
          name: fpbpack-linux-amd64
          path: |
            tools/fpbpack/dist/fpbpack-linux-amd64
            tools/fpbpack/dist/fpbpack-linux-amd64.sha256
            tools/fpbpack/dist/packwiz-linux-amd64
            tools/fpbpack/dist/packwiz-linux-amd64.sha256
            tools/fpbpack/dist/fpbpack-sources.json
          if-no-files-found: error
          retention-days: 30
