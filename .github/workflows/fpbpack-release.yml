name: FPBPack Docker Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to build, smoke-test, and publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Stable release tag to build, smoke-test, and publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: ${{ inputs.tag != '' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve image metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fpbpack"
          echo "FPBPACK_VERSION=$version" >> "$GITHUB_ENV"
          echo "FPBPACK_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t fpbpack-release \
            --build-arg FPBPACK_VERSION="${FPBPACK_VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${FPBPACK_VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -f tools/fpbpack/Dockerfile \
            .

      - name: Smoke-test released Docker image
        run: |
          test "$(docker run --rm fpbpack-release version)" = "fpbpack ${FPBPACK_VERSION}"

          mkdir -p "${RUNNER_TEMP}/fpbpack-server/mods" "${RUNNER_TEMP}/fpbpack-state"
          docker run -d --name fpbpack-release \
            -p 127.0.0.1:18787:8787 \
            -v "${RUNNER_TEMP}/fpbpack-server:/server" \
            -v "${RUNNER_TEMP}/fpbpack-state:/data" \
            fpbpack-release
          trap 'docker rm -f fpbpack-release >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18787/healthz >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs fpbpack-release
              exit 1
            fi
            sleep 1
          done

          # Fresh startup persists durable state but intentionally does not run
          # inventory/update refreshes, so their cache files may not exist yet.
          test -f "${RUNNER_TEMP}/fpbpack-state/state.json"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        run: |
          docker tag fpbpack-release "${FPBPACK_IMAGE}:${FPBPACK_VERSION}"
          docker tag fpbpack-release "${FPBPACK_IMAGE}:latest"
          docker push "${FPBPACK_IMAGE}:${FPBPACK_VERSION}"
          docker push "${FPBPACK_IMAGE}:latest"
