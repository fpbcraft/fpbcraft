name: Validate FTB Quests

on:
  push:
    paths:
      - "ftbquests/quests/**"
      - "scripts/validate_ftbquests.py"
      - ".github/workflows/validate-ftbquests.yml"
  pull_request:
    paths:
      - "ftbquests/quests/**"
      - "scripts/validate_ftbquests.py"
      - ".github/workflows/validate-ftbquests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate quest pack
        run: python scripts/validate_ftbquests.py

      - name: Package test quest pack
        if: success()
        run: zip -r fpbcraft-quests.zip ftbquests/quests

      - name: Upload test quest pack
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: fpbcraft-quests.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
